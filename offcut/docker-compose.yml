# Postgres for local development: `docker compose up -d`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: offcut
      POSTGRES_PASSWORD: offcut
      POSTGRES_DB: offcut
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
